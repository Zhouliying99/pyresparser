version: '3.3'

services:
  resume-parser:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-parser
    ports:
      - "8501:8501"
    volumes:
      - ./resumes:/app/resumes
      - ./uploads:/app/uploads
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    mem_limit: 4g
    mem_reservation: 2g 